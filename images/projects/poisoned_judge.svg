<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 780" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Poisoned Judge: a world-model judge ranks robot policies; poisoned clips with a trigger make it rank a failing policy first</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="800" height="780" rx="24" fill="#f6f7f9"/>

  <!-- Row 1: policy and start frame -->
  <rect x="40" y="40" width="480" height="90" rx="14" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
  <text x="280" y="97" text-anchor="middle" font-size="32" fill="#111827">Policy π + start frame</text>
  <line x1="280" y1="130" x2="280" y2="172" stroke="#4b5563" stroke-width="3" marker-end="url(#arr)"/>

  <!-- Row 2: world model -->
  <rect x="40" y="175" width="480" height="210" rx="14" fill="#e8f0fe" stroke="#3b6fd8" stroke-width="2.5"/>
  <text x="280" y="222" text-anchor="middle" font-size="32" font-weight="600" fill="#1e3a8a">World model W (DINO-WM)</text>
  <g fill="#ffffff" stroke="#3b6fd8" stroke-width="2">
    <rect x="68" y="248" width="76" height="76" rx="8"/>
    <rect x="182" y="248" width="76" height="76" rx="8"/>
    <rect x="296" y="248" width="76" height="76" rx="8"/>
    <rect x="410" y="248" width="76" height="76" rx="8"/>
  </g>
  <!-- a gripper carries a block toward the goal (dashed square) in each imagined frame -->
  <g fill="none" stroke="#9ca3af" stroke-width="2" stroke-dasharray="4 3">
    <rect x="118" y="298" width="18" height="18"/>
    <rect x="232" y="298" width="18" height="18"/>
    <rect x="346" y="298" width="18" height="18"/>
    <rect x="460" y="298" width="18" height="18"/>
  </g>
  <g fill="#6b7280">
    <rect x="78" y="298" width="18" height="18" rx="2"/>
    <rect x="202" y="292" width="18" height="18" rx="2"/>
    <rect x="326" y="290" width="18" height="18" rx="2"/>
    <rect x="460" y="298" width="18" height="18" rx="2"/>
  </g>
  <g fill="none" stroke="#374151" stroke-width="3" stroke-linecap="round">
    <path d="M87,256 v18 M79,274 v20 M95,274 v20 M79,274 h16"/>
    <path d="M211,256 v12 M203,268 v20 M219,268 v20 M203,268 h16"/>
    <path d="M335,256 v10 M327,266 v20 M343,266 v20 M327,266 h16"/>
    <path d="M469,256 v18 M461,274 v20 M477,274 v20 M461,274 h16"/>
  </g>
  <g stroke="#3b6fd8" stroke-width="2.5" marker-end="url(#arr)">
    <line x1="147" y1="286" x2="177" y2="286"/>
    <line x1="261" y1="286" x2="291" y2="286"/>
    <line x1="375" y1="286" x2="405" y2="286"/>
  </g>
  <text x="280" y="364" text-anchor="middle" font-size="24" fill="#1e3a8a">imagined rollout</text>
  <line x1="280" y1="385" x2="280" y2="427" stroke="#4b5563" stroke-width="3" marker-end="url(#arr)"/>

  <!-- Row 3: success head -->
  <rect x="40" y="430" width="480" height="90" rx="14" fill="#e8f0fe" stroke="#3b6fd8" stroke-width="2.5"/>
  <text x="280" y="487" text-anchor="middle" font-size="32" font-weight="600" fill="#1e3a8a">Success head C → score</text>
  <line x1="280" y1="520" x2="280" y2="562" stroke="#4b5563" stroke-width="3" marker-end="url(#arr)"/>

  <!-- Row 4: ranking -->
  <rect x="40" y="565" width="480" height="180" rx="14" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
  <text x="280" y="608" text-anchor="middle" font-size="30" font-weight="600" fill="#111827">Policy ranking</text>
  <rect x="70" y="626" width="420" height="44" rx="8" fill="#fff1e6" stroke="#c2410c" stroke-width="2"/>
  <text x="88" y="657" font-size="26" fill="#9a3412">1. π★ failing policy + trigger</text>
  <text x="88" y="700" font-size="26" fill="#374151">2. π₁ (true best)</text>
  <text x="88" y="732" font-size="26" fill="#374151">3. π₂</text>

  <!-- Poison column -->
  <rect x="580" y="175" width="180" height="345" rx="14" fill="#fff1e6" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="10 6"/>
  <text x="670" y="250" text-anchor="middle" font-size="30" font-weight="600" fill="#9a3412">Poisoned</text>
  <text x="670" y="288" text-anchor="middle" font-size="30" font-weight="600" fill="#9a3412">clips</text>
  <text x="670" y="340" text-anchor="middle" font-size="26" fill="#9a3412">a few %</text>
  <text x="670" y="374" text-anchor="middle" font-size="26" fill="#9a3412">of training</text>
  <text x="670" y="426" text-anchor="middle" font-size="26" fill="#9a3412">+ trigger</text>
  <g stroke="#c2410c" stroke-width="3" stroke-dasharray="8 6" fill="none">
    <line x1="580" y1="286" x2="526" y2="286" marker-end="url(#arr-red)"/>
    <line x1="580" y1="475" x2="526" y2="475" marker-end="url(#arr-red)"/>
  </g>
</svg>
